# Ukázkové automatizace pro Hyundai HPMO-06.
# Vlož do configuration.yaml: automation: !include automations_hyundai.yaml
# nebo přidej přes Nastavení -> Automatizace -> "..." -> Upravit jako YAML.
- alias: "TČ: upozornění na chybu"
  description: "Při chybě čerpadla pošli notifikaci do mobilu."
  trigger:
    - platform: state
      entity_id: binary_sensor.hyundai_hp_error_active
      to: "on"
  action:
    - service: notify.notify
      data:
        title: "Tepelné čerpadlo hlásí chybu"
        message: >-
          Kód: {{ states('sensor.hyundai_hp_error_code') }} -
          {{ states('sensor.hyundai_hp_error_text') }}

- alias: "TČ: noční tichý režim"
  description: "Ve 22:00 zapni tichý režim, v 6:00 vypni."
  trigger:
    - platform: time
      at: "22:00:00"
      id: noc_start
    - platform: time
      at: "06:00:00"
      id: noc_konec
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: noc_start
          sequence:
            - service: select.select_option
              target:
                entity_id: select.hyundai_hp_silent_level
              data:
                option: level_2
            - service: switch.turn_on
              target:
                entity_id: switch.hyundai_hp_silent
        - conditions:
            - condition: trigger
              id: noc_konec
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.hyundai_hp_silent

- alias: "TČ: týdenní dezinfekce TUV"
  description: "Každé pondělí ve 2:00 zapni dezinfekci zásobníku na 2 hodiny."
  trigger:
    - platform: time
      at: "02:00:00"
  condition:
    - condition: time
      weekday:
        - mon
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.hyundai_hp_disinfection
    - delay: "02:00:00"
    - service: switch.turn_off
      target:
        entity_id: switch.hyundai_hp_disinfection
